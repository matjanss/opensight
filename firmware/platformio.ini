; OpenSights firmware (NodeMCU-32S). See ../CLAUDE.md and ../protocol/PROTOCOL.md.
[platformio]
; `pio run` builds the board only; the native env is for `pio test -e native`.
default_envs = nodemcu-32s

[env:nodemcu-32s]
; Pinned: pioarduino's "stable" moved to 61.04.00 (Arduino-ESP32 4.0, IDF 6.1) on 2026-11-19,
; whose MCPWM API pulsegen.cpp doesn't build against. 55.03.312-1 is Arduino-ESP32 3.3.12 on
; IDF 5.5.5, what the bench tests ran on. Move up on purpose, with the bench tests again.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
; 921600 (the board default) fails on this board's USB-serial link.
upload_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino@2.5.2

; The portable measurement core (lib/measure, lib/bme280) on the PC: `pio test -e native`.
; Unity tests in test/test_measure against the vectors in test/vectors (tools/model.py).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -O2 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE -DVECTOR_DIR=\"$PROJECT_DIR/test/vectors\"
lib_compat_mode = off
