; OpenSights firmware (NodeMCU-32S). See ../CLAUDE.md and ../protocol/PROTOCOL.md.
[platformio]
; `pio run` builds the board only; the native env is for `pio test -e native`.
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
; 921600 (the board default) fails on this board's USB-serial link.
upload_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

; The portable measurement core (lib/measure, lib/bme280) on the PC: `pio test -e native`.
; Unity tests in test/test_measure against the vectors in test/vectors (tools/model.py).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -O2 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE -DVECTOR_DIR=\"$PROJECT_DIR/test/vectors\"
lib_compat_mode = off
