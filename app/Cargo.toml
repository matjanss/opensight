[package]
name = "opensights-app"
version = "0.1.2"
edition = "2024"

[dependencies]
calib = { path = "calib" }
cardphoto = { path = "cardphoto" }
btleplug = "0.13.5"
eframe = { version = "0.37", features = ["persistence"] }
# Monochrome emoji (the replay speed animals, ⚠) compiled in, instead of the system's
# color emoji font: the UI is grayscale, and looks the same everywhere.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
futures = "0.3.34"
resvg = { version = "0.45", default-features = false, features = ["text"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
uuid = "1.29.2"
tiny_http = { version = "0.12.0", default-features = false }
qrcode = { version = "0.15.0", default-features = false }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# btleplug talks to BlueZ over D-Bus. "vendored" builds libdbus from source, so building
# doesn't need the libdbus-1-dev system package (the running D-Bus daemon is still used).
[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }
# The pairing agent (src/agent.rs). Same versions btleplug already uses.
dbus = "0.9"
dbus-tokio = "0.7"

# Embeds assets/icon/opensights.ico in the .exe (build.rs), so Explorer shows the icon.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The calibration crate (calib/: the solver and the fit, PLAN D5) is built and tested with the
# app: `cargo test` runs both.
[workspace]
members = ["calib", "cardphoto"]
default-members = [".", "calib", "cardphoto"]

# Image processing on whole photos: optimised in test and debug builds too (the dependencies
# and the image crates), or the tests take minutes.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.cardphoto]
opt-level = 3
[profile.dev.package.calib]
opt-level = 3
