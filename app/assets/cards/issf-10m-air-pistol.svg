  <!-- ISSF 10 m air pistol target. 1 unit = 1 mm; the centre is at (85, 85). A ring's stated
       diameter is to its line's outer edge (ISSF), as on printed cards: each 0.2 mm line is
       drawn 0.1 mm inside it (77.75 -> 77.65). -->
