# Builds and tests the app on Linux, Windows and macOS, and builds the firmware, on a push
# to main and on pull requests, but only the parts a change touches: docs and hardware
# alone run nothing, the app builds on app changes, the firmware on firmware changes.
# A tag like v0.1.0, or a run started by hand (Actions, "Run workflow"), builds
# everything; a tag also publishes a GitHub Release with the files.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Not evaluated for tags: a tag always builds.
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "hardware/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"
      - "hardware/**"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # "v0.1.0" on a tag, otherwise the short commit, e.g. "dev-1a2b3c4".
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  # Which parts the change touches. A tag or a run by hand builds everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || env.ALL == 'true' }}
      firmware: ${{ steps.filter.outputs.firmware == 'true' || env.ALL == 'true' }}
    env:
      ALL: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The app's tests read firmware/test/vectors (the solver against the firmware);
          # a protocol change touches both sides; a workflow change rebuilds everything.
          filters: |
            app:
              - "app/**"
              - "protocol/**"
              - "firmware/test/vectors/**"
              - ".github/workflows/**"
            firmware:
              - "firmware/**"
              - "protocol/**"
              - ".github/workflows/**"

  app:
    name: App (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc: the binary also runs on older distributions
          - name: windows-x86_64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Test
        run: cargo test --locked

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir -p ../dist
          # With the .desktop file and icon: Wayland docks show only the icon a .desktop
          # file names (see assets/icon/README.md).
          tar -czf ../dist/opensights-app-$VERSION-linux-x86_64.tar.gz \
            -C "$PWD/target/release" opensights-app \
            -C "$PWD/linux" opensights-app.desktop \
            -C "$PWD/assets/icon/png" opensights-icon-256.png

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          mkdir -p ../dist
          7z a ../dist/opensights-app-$VERSION-windows-x86_64.zip ./target/release/opensights-app.exe

      - name: Build and package (macOS, Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          app="OpenSights.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/opensights-app" \
            target/aarch64-apple-darwin/release/opensights-app \
            target/x86_64-apple-darwin/release/opensights-app
          sed "s/VERSION/${VERSION#v}/g" macos/Info.plist > "$app/Contents/Info.plist"
          mkdir -p "$app/Contents/Resources"
          cp assets/icon/opensights.icns "$app/Contents/Resources/"
          # Ad-hoc signature (no Apple developer account): seals Info.plist, which macOS
          # needs to ask for the Bluetooth permission.
          codesign --force --deep --sign - "$app"
          mkdir -p ../dist
          ditto -c -k --keepParent "$app" ../dist/opensights-app-$VERSION-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  firmware:
    name: Firmware
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build
        run: |
          pip install platformio
          pio run -d firmware

      - name: Test the measurement core (PC)
        run: pio test -d firmware -e native

      - name: Test the bench analysis (PC)
        working-directory: firmware
        run: |
          pip install numpy scipy
          python3 tools/bench.py --selftest
          python3 tools/calibrate.py --selftest

      - name: Build the replay tool and the Huber study (PC)
        working-directory: firmware
        run: |
          g++ -std=gnu++17 -O2 -mfma -ffp-contract=fast -Wall -Wextra -Werror -I lib/measure -o tools/replay tools/replay.cpp lib/measure/solver.cpp lib/measure/record.cpp
          g++ -std=gnu++17 -O2 -mfma -ffp-contract=fast -Wall -Wextra -Werror -I lib/measure -o tools/huber_study tools/huber_study.cpp lib/measure/solver.cpp

      - name: Package
        run: |
          b=firmware/.pio/build/nodemcu-32s
          mkdir -p dist
          # Complete image, flashed at 0x0 (esptool or a web flasher).
          cp $b/firmware.factory.bin dist/opensights-firmware-$VERSION-nodemcu-32s-full.bin
          # Application only, at 0x10000: an update over an earlier flash.
          cp $b/firmware.bin dist/opensights-firmware-$VERSION-nodemcu-32s-app.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **App** (unsigned, see the notes per system in the README):
            - Linux: `opensights-app-…-linux-x86_64.tar.gz`
            - Windows 11: `opensights-app-…-windows-x86_64.zip`
            - macOS (Apple Silicon and Intel): `opensights-app-…-macos-universal.zip`

            **Firmware** (NodeMCU-32S):
            - `…-full.bin`: complete image, flash at `0x0`
            - `…-app.bin`: application only, flash at `0x10000`
